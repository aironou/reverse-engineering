services:
    emulator:
        environment:
            DISPLAY: "${DISPLAY:-:0}"
        command: [
            "-no-metrics",
            "-no-boot-anim",
            "-no-audio",
            "-no-window",
            "-accel", "on",
            "-gpu", "host",
            "-prop", "hw.keyboard=yes",
            "-no-snapshot-load"
        ]
